[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempverity"
version = "0.1.0"
description = "TempVerity professional refrigeration monitoring application"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
  "sqlalchemy>=2.0.52",
  "alembic>=1.19.2",
  "httpx>=0.28.1",
  "pydantic-settings>=2.15.0",
  "aiosmtplib>=5.1.2",
  "argon2-cffi>=25.1.0",
  "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
