services:
  tempverity:
    build:
      context: .
      dockerfile: Dockerfile
    image: tempverity:local
    container_name: tempverity
    ports:
      - "8080:8000"
    environment:
      TEMPVERITY_SUPPORT_EMAIL: "${TEMPVERITY_SUPPORT_EMAIL:-placeholder@placeholder.com}"
      TEMPVERITY_READ_ONLY: "${TEMPVERITY_READ_ONLY:-true}"
      TEMPVERITY_DB_PATH: /data/tempverity.sqlite3
      TEMPVERITY_DATA_DIR: /data
      TEMPVERITY_INFLUX_ENABLED: "${TEMPVERITY_INFLUX_ENABLED:-true}"
      TEMPVERITY_INFLUX_URL: "${TEMPVERITY_INFLUX_URL:-http://127.0.0.1:1234}"
      TEMPVERITY_INFLUX_ORG: "${TEMPVERITY_INFLUX_ORG:-}"
      TEMPVERITY_INFLUX_BUCKET: "${TEMPVERITY_INFLUX_BUCKET:-}"
      TEMPVERITY_INFLUX_TOKEN: "${TEMPVERITY_INFLUX_TOKEN:-}"
      TEMPVERITY_GRAFANA_EMBEDS_ENABLED: "${TEMPVERITY_GRAFANA_EMBEDS_ENABLED:-false}"
    volumes:
      - ./data:/data
    restart: unless-stopped
